<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="/utils/canvas-to-image.min.js"></script>
        <script defer src="https://use.fontawesome.com/releases/v5.3.1/js/all.js"></script>
        <title>Mazes For Programmers</title>
        <link rel="stylesheet" href="/src/sass/main.scss">
    </head>
    <body class="min-h-screen bg-white text-slate-900">
        <header class="border-b border-slate-200 bg-[#222529] text-white">
            <div class="mx-auto flex max-w-[1600px] items-center justify-between px-4 py-3">
                <a class="flex items-center gap-2" href="/">
                    <img src="logo.png" class="h-6 w-6" />
                    <span class="text-sm font-semibold tracking-wide">MFP</span>
                </a>
                <div class="flex items-center gap-3">
                    <button id="options-btn" class="text-sm font-medium text-white/90 hover:text-white">Options</button>
                    <div class="flex items-center gap-2">
                        <button id="generate-btn" class="rounded-md bg-emerald-600 px-3 py-3 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-400">Generate</button>
                        <div class="flex items-center">
                            <select id="quick-solve-algo" class="h-full rounded-l-md border-0 bg-white/10 px-2 py-3 text-sm font-semibold text-white ring-1 ring-inset ring-white/20 focus:outline-none focus:ring-2 focus:ring-white/40">
                                <option value="Dijkstra" class="text-slate-900">Dijkstra</option>
                                <option value="A*" class="text-slate-900">A*</option>
                            </select>
                            <button id="solve-btn" class="rounded-r-md bg-white/10 px-3 py-3 text-sm font-semibold text-white shadow-sm ring-1 ring-inset ring-white/20 hover:bg-white/15 focus:outline-none focus:ring-2 focus:ring-white/40">Solve</button>
                        </div>
                        <button id="compare-btn" class="rounded-md bg-amber-600 px-3 py-3 text-sm font-semibold text-white shadow-sm hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-400">Compare All</button>
                    </div>
                </div>
            </div>
        </header>
        <main class="p-1">
            <div id="solver-stats" class="flex items-center gap-3 px-4 py-2 text-sm text-slate-700 bg-slate-100 border-b border-slate-200 overflow-hidden transition-all duration-300 ease-out max-h-0 opacity-0"></div>
            <div id="comparison-table" class="overflow-hidden transition-all duration-300 ease-out max-h-0 opacity-0">
                <table class="w-full text-sm text-left border-b border-slate-200">
                    <thead class="bg-slate-100 text-slate-700">
                        <tr>
                            <th class="px-4 py-2 font-semibold">Algorithm</th>
                            <th class="px-4 py-2 font-semibold cursor-help" title="Total cells explored. Lower is better.">Cells Visited</th>
                            <th class="px-4 py-2 font-semibold cursor-help" title="Solution path length. Lower is better.">Path Length</th>
                            <th class="px-4 py-2 font-semibold cursor-help" title="Path / Visited ratio. Higher is better.">Efficiency</th>
                            <th class="px-4 py-2 font-semibold cursor-help" title="Computation time. Lower is better.">Time (ms)</th>
                        </tr>
                    </thead>
                    <tbody id="comparison-body"></tbody>
                </table>
            </div>
            <div id="canvas-container" class="overflow-auto">
                <canvas id="maze" width="1900" height="950" class="block bg-white"></canvas>
            </div>
        </main>

        <div class="modal fixed inset-0 z-50 hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-background absolute inset-0 bg-black/50"></div>
            <div class="relative flex min-h-full items-start justify-center p-4 sm:p-8">
                <div class="modal-card w-full max-w-3xl overflow-hidden rounded-lg bg-white shadow-xl ring-1 ring-black/10">
                    <header class="modal-card-head flex items-center justify-between border-b border-slate-200 px-6 py-4">
                        <p id="modal-title" class="text-xl font-semibold text-slate-900">Configuration Options</p>
                        <button class="delete inline-flex h-8 w-8 items-center justify-center rounded-full text-slate-500 hover:bg-slate-100 hover:text-slate-700" aria-label="close" type="button">×</button>
                    </header>
                    <section class="modal-card-body px-6 py-6">
                        <div class="content space-y-8">
                            <div>
                                <h2 class="modal-hdr mb-4 text-2xl font-semibold text-slate-900">Maze Options</h2>

                                <div class="space-y-4">
                                    <div class="field space-y-2">
                                        <label class="label text-sm font-semibold text-slate-800">Generation Algorithm</label>
                                        <div class="control">
                                            <select id="maze-gen-algo" class="w-56 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200">
                                                <option>Aldous Broder</option>
                                                <option>Binary Tree</option>
                                                <option>Sidewinder</option>
                                                <option selected="selected">Wilson</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="field">
                                        <div class="control">
                                            <input class="input w-full rounded-md border border-emerald-400 px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" id="rows" type="number" placeholder="number of rows">
                                        </div>
                                    </div>
                                    <div class="field">
                                        <div class="control">
                                            <input class="input w-full rounded-md border border-emerald-400 px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" id="cols" type="number" placeholder="number of columns">
                                        </div>
                                    </div>
                                    <div class="field">
                                        <div class="control">
                                            <input class="input w-full rounded-md border border-emerald-400 px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200" id="cell-pixel-size" type="number" placeholder="cell pixel size">
                                        </div>
                                    </div>

                                    <div class="field">
                                        <div class="flex flex-wrap gap-2">
                                            <button type="button" class="button cell-size-increase rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-800 hover:bg-slate-50" data-amount="5">Five</button>
                                            <button type="button" class="button cell-size-increase rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-800 hover:bg-slate-50" data-amount="10">Ten</button>
                                            <button type="button" class="button cell-size-increase rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-800 hover:bg-slate-50" data-amount="15">Fifteen</button>
                                            <button type="button" class="button cell-size-increase rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-800 hover:bg-slate-50" data-amount="20">Twenty</button>
                                            <button type="button" class="button cell-size-increase rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-800 hover:bg-slate-50" data-amount="30">Thirty</button>
                                            <button type="button" class="button cell-size-increase rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-800 hover:bg-slate-50" data-amount="40">Forty</button>
                                        </div>
                                    </div>

                                    <div class="field">
                                        <label class="checkbox flex items-center gap-2 text-sm text-slate-800">
                                            <input type="checkbox" id="show-ids" class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-200">
                                            Show Cell IDs
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <hr class="border-slate-200" />

                            <div>
                                <h2 class="modal-hdr mb-4 text-2xl font-semibold text-slate-900">Solution Options</h2>

                                <div class="space-y-4">
                                    <div class="field space-y-2">
                                        <label class="label text-sm font-semibold text-slate-800">Solution Draw Speed</label>
                                        <div class="control">
                                            <select id="solve-speed" class="w-56 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200">
                                                <option selected="selected">Sloth-like</option>
                                                <option selected="selected">Slow</option>
                                                <option>Medium</option>
                                                <option>Fast</option>
                                                <option>Ludicrous</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="field">
                                        <label class="checkbox flex items-center gap-2 text-sm text-slate-800">
                                            <input type="checkbox" id="slow-mode" checked="true" class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-200">
                                            Slow mode
                                        </label>
                                    </div>
                                    <div class="field">
                                        <label class="checkbox flex items-center gap-2 text-sm text-slate-800">
                                            <input type="checkbox" id="show-weights" class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-200">
                                            Show cell solution weights
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                    <footer class="modal-card-foot flex items-center gap-3 border-t border-slate-200 bg-slate-50 px-6 py-4">
                        <button class="button rounded-md bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-200" id="save-options-btn" type="button">Save & Generate</button>
                        <button class="button rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-800 shadow-sm hover:bg-slate-50" id="cancel-options-btn" type="button">Cancel</button>
                    </footer>
                </div>
            </div>
        </div>
        <script src="/src/js/app.js" type="module"></script>
        <footer>
        </footer>
    </body>
</html>
